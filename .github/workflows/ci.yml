# Tests on every push to main and every pull request; the release workflow runs them
# again before it builds anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For the check of the PostgreSQL migrations (internal/server/store).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DARTS_O_MAT_TEST_POSTGRES: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The packaging tools are a module of their own, not covered by the commands above.
      - run: go -C tools vet ./...
      # The installer of darts-o-cam.
      - run: shellcheck -s bash install.sh install_test.sh
      - run: bash install_test.sh

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/darts-o-mat
      - run: helm template t deploy/helm/darts-o-mat > /dev/null
      - run: helm template t deploy/helm/darts-o-mat --set config.database=postgres --set config.postgres.dsn=postgres://u:p@h/db --set replicaCount=3 > /dev/null
