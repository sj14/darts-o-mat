# A release is a git tag vX.Y.Z (or vX.Y.Z-rc.1 for a pre-release). One tag builds
# everything, server and camera (user's decision 2026-10-18: one tag for both is simpler
# than separate ones):
#
#   - the server's binaries for macOS and Windows (amd64 and arm64),
#   - the server's container image ghcr.io/<owner>/darts-o-mat (amd64 and arm64),
#   - the Helm chart oci://ghcr.io/<owner>/charts/darts-o-mat,
#   - the Linux packages (.deb, .rpm, .tar.gz) of the server, with a systemd service, and of
#     darts-o-cam, all from tools/linuxpkg,
#   - darts-o-cam: macOS app (amd64, arm64) and Windows .zip,
#
# and attaches the binaries and packages with their checksums to a GitHub release. The
# archives have no version in their names (darts-o-mat_darwin_amd64.tar.gz), so
# https://github.com/<owner>/darts-o-mat/releases/latest/download/<name> is a link that
# always points to the newest stable release (a pre-release isn't "latest"); the
# .deb and .rpm are built with such names too (darts-o-mat_linux_amd64.deb, the version is
# inside the package); no renaming afterwards.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # The version without the "v": v1.2.3 -> 1.2.3
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # The server for macOS and Windows; its Linux packages are built by the packages job.
  server:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="darts-o-mat_${VERSION}_${GOOS}_${GOARCH}"
          archive="darts-o-mat_${GOOS}_${GOARCH}"
          exe=darts-o-mat; [ "$GOOS" = windows ] && exe=darts-o-mat.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X github.com/sj14/darts-o-mat/internal/common/buildinfo.stamped=${VERSION}" -o "dist/$name/$exe" ./cmd/darts-o-mat
          cp LICENSE cmd/darts-o-mat/README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$archive.zip" "$name"; else tar czf "$archive.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # The Linux packages of both programs and darts-o-cam for Windows are built on Linux: no
  # cgo, so it cross-compiles.
  packages:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make linux windows VERSION=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-windows
          path: dist/*

  # The macOS app needs macOS (iconutil, codesign) and is built for the architecture it
  # runs on; the Intel one is built with the same tool, told to build for amd64.
  camera-macos:
    needs: [test, version]
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the app
        run: |
          # Built for the runner, run in the tools module (it finds the project from there);
          # GOARCH only applies to the darts-o-cam it builds.
          go -C tools build -o ../macapp ./macapp
          (cd tools && GOARCH=${{ matrix.goarch }} ../macapp -o ../darts-o-cam.app)
          mkdir -p dist
          ditto -c -k --keepParent darts-o-cam.app "dist/darts-o-cam_macos_${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: camera-macos-${{ matrix.goarch }}
          path: dist/*

  image:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # Built on the runner's platform for both targets (see the Containerfile), no QEMU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    needs: [test, version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/darts-o-mat --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/darts-o-mat-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"

  release:
    needs: [server, packages, camera-macos, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes $flags
