{{- if and (eq .Values.config.database "sqlite") .Values.sqlite.persistence.enabled (not .Values.sqlite.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "darts-o-mat.fullname" . }}
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
  annotations:
    # Keep the games when the release is uninstalled.
    helm.sh/resource-policy: keep
    {{- with .Values.sqlite.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.sqlite.persistence.accessMode }}
  {{- if .Values.sqlite.persistence.storageClass }}
  storageClassName: {{ .Values.sqlite.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sqlite.persistence.size }}
{{- end }}
