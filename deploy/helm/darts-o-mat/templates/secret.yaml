{{- if and (eq .Values.config.database "postgres") (not .Values.postgresql.enabled) (not .Values.config.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "darts-o-mat.dsnSecret" . }}
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.postgres.existingSecretKey }}: {{ .Values.config.postgres.dsn | quote }}
{{- end }}
{{- if and .Values.config.turnstile.secretKey (not .Values.config.turnstile.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "darts-o-mat.turnstileSecret" . }}
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.turnstile.existingSecretKey }}: {{ .Values.config.turnstile.secretKey | quote }}
{{- end }}
