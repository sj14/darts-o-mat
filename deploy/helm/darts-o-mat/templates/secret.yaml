{{- if and (eq .Values.config.database "postgres") (not .Values.config.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "darts-o-mat.fullname" . }}-dsn
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.postgres.existingSecretKey }}: {{ required "config.postgres.dsn or config.postgres.existingSecret is needed with config.database=postgres" .Values.config.postgres.dsn | quote }}
{{- end }}
