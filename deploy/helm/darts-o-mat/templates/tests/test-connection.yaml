apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "darts-o-mat.fullname" . }}-test-connection"
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['-q', '-O', '/dev/null', 'http://{{ include "darts-o-mat.fullname" . }}:{{ .Values.service.port }}/login']
  restartPolicy: Never
