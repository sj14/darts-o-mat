{{- $postgres := eq .Values.config.database "postgres" }}
{{- include "darts-o-mat.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "darts-o-mat.fullname" . }}
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $postgres }}
    # The replicas share PostgreSQL: a new pod starts before the old one stops.
    type: RollingUpdate
    {{- else }}
    # The SQLite volume can only be used by one pod at a time.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "darts-o-mat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        # A secret changed in the values restarts the pods.
        {{- with .Values.config.postgres.dsn }}
        checksum/dsn: {{ . | sha256sum }}
        {{- end }}
        {{- with .Values.config.turnstile.secretKey }}
        checksum/turnstile: {{ . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "darts-o-mat.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "darts-o-mat.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr=:3000
            - -db={{ .Values.config.database }}
            - -max-login-failures={{ .Values.config.maxLoginFailures }}
            {{- with .Values.config.clientIPHeader }}
            - -client-ip-header={{ . }}
            {{- end }}
            {{- if .Values.config.logRequests }}
            - -log-requests
            {{- end }}
            {{- if .Values.pprof.enabled }}
            - -pprof=localhost:{{ .Values.pprof.port }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $postgres .Values.config.turnstile.siteKey .Values.extraEnv }}
          env:
            {{- if .Values.postgresql.enabled }}
            - name: DARTS_O_MAT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "darts-o-mat.postgresqlSecret" . }}
                  key: {{ .Values.postgresql.auth.existingSecretKey }}
            # The chart's PostgreSQL, with the password of the variable above.
            - name: DARTS_O_MAT_DSN
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(DARTS_O_MAT_POSTGRES_PASSWORD)@{{ include "darts-o-mat.postgresql" . }}:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- else if $postgres }}
            - name: DARTS_O_MAT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "darts-o-mat.dsnSecret" . }}
                  key: {{ .Values.config.postgres.existingSecretKey }}
            {{- end }}
            {{- if .Values.config.turnstile.siteKey }}
            - name: DARTS_O_MAT_TURNSTILE_SITE_KEY
              value: {{ .Values.config.turnstile.siteKey | quote }}
            - name: DARTS_O_MAT_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "darts-o-mat.turnstileSecret" . }}
                  key: {{ .Values.config.turnstile.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (not $postgres) .Values.volumeMounts }}
          volumeMounts:
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (not $postgres) .Values.volumes }}
      volumes:
        {{- if not $postgres }}
        - name: data
          {{- if .Values.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.sqlite.persistence.existingClaim | default (include "darts-o-mat.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
