{{- $postgres := eq .Values.config.database "postgres" }}
{{- if not (has .Values.config.database (list "sqlite" "postgres")) }}
{{- fail "config.database must be sqlite or postgres" }}
{{- end }}
{{- if and (not $postgres) (gt (int .Values.replicaCount) 1) }}
{{- fail "replicaCount above 1 needs config.database=postgres: SQLite is one file for one process" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "darts-o-mat.fullname" . }}
  labels:
    {{- include "darts-o-mat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $postgres }}
    # The replicas share PostgreSQL: a new pod starts before the old one stops.
    type: RollingUpdate
    {{- else }}
    # The SQLite volume can only be used by one pod at a time.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "darts-o-mat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $postgres }}
        {{- if .Values.config.postgres.dsn }}
        checksum/dsn: {{ .Values.config.postgres.dsn | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "darts-o-mat.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "darts-o-mat.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr=:3000
            - -db={{ .Values.config.database }}
            {{- if $postgres }}
            - -dsn=$(DARTS_O_MAT_DSN)
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $postgres .Values.extraEnv }}
          env:
            {{- if $postgres }}
            - name: DARTS_O_MAT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "darts-o-mat.dsnSecret" . }}
                  key: {{ .Values.config.postgres.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (not $postgres) .Values.volumeMounts }}
          volumeMounts:
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (not $postgres) .Values.volumes }}
      volumes:
        {{- if not $postgres }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "darts-o-mat.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
