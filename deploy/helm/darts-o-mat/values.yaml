# Values of the darts-o-mat chart.

# More than one replica only with config.database=postgres: the replicas share the
# database, which also carries their live updates (LISTEN/NOTIFY) and orders the darts.
# With SQLite there is exactly one, and an update stops it before the new one starts.
replicaCount: 1

image:
  repository: ghcr.io/sj14/darts-o-mat
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The server doesn't talk to the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as "nonroot" (65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# How the server runs, see the flags of darts-o-mat; every environment variable of the
# server is set here. Whether anyone may register is set by the admin in the web interface.
config:
  # sqlite: a file in the volume /data (sqlite.persistence below), good for a home installation.
  # postgres: PostgreSQL, either the chart's own (postgresql.enabled below) or a server
  # of your own (config.postgres); then nothing is stored in the server's pod.
  database: sqlite
  # A PostgreSQL server of your own (with postgresql.enabled=false): its data source name
  # ($DARTS_O_MAT_DSN), e.g. postgres://darts:secret@postgres:5432/darts?sslmode=disable.
  # Kept in a Secret of this chart; or name a Secret of your own instead.
  postgres:
    dsn: ""
    existingSecret: ""
    existingSecretKey: dsn
  # Only for servers strangers can register on: registering needs a Cloudflare Turnstile
  # check. Both keys or none ($DARTS_O_MAT_TURNSTILE_SITE_KEY and
  # $DARTS_O_MAT_TURNSTILE_SECRET_KEY); the secret key is kept in a Secret of this chart,
  # or name a Secret of your own instead.
  turnstile:
    siteKey: ""
    secretKey: ""
    existingSecret: ""
    existingSecretKey: secret-key
  # Failed logins a username may have within 15 minutes before it is locked for a while,
  # a network 5 times as many (-max-login-failures); 0 is no limit.
  maxLoginFailures: 10
  # The header the ingress or proxy passes the visitor's address in, e.g. X-Forwarded-For
  # (-client-ip-header), so the limit per network works. Only if every request comes
  # through it; empty: the limit per network is off, only the one per username counts.
  clientIPHeader: ""
  # Log every request (-log-requests), e.g. to look for a problem; else the log only has
  # the start and errors.
  logRequests: false
  # Ask GitHub for the latest release when starting and once a day, for the hint about a
  # newer version in the footer; false passes -no-update-check.
  updateCheck: true

# The volume of the SQLite database (config.database=sqlite), mounted at /data. Without it
# the data is gone when the pod is replaced.
sqlite:
  persistence:
    enabled: true
    # Use a claim you created yourself.
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}

# A simple PostgreSQL of the chart: one pod (StatefulSet) with its own volume, for
# config.database=postgres without a server of your own. Its volume stays when the chart
# is uninstalled. For backups, high availability or tuning use a server of your own.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  auth:
    username: darts-o-mat
    database: darts-o-mat
    # Empty: a random password is made at the install and kept in a Secret, which stays
    # when the chart is uninstalled (the volume still needs it). It becomes part of the
    # data source name, so only letters and digits. Or name a Secret of your own.
    password: ""
    existingSecret: ""
    existingSecretKey: password
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

service:
  type: ClusterIP
  port: 80

# The game pages are updated live with Server-Sent Events: a proxy must not buffer them
# and not close idle connections too early (the server sends a keepalive every 25 s).
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: darts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: darts-tls
    #   hosts:
    #     - darts.example.com

# Or expose it with the Gateway API.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - darts.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /login
    port: http
readinessProbe:
  httpGet:
    path: /login
    port: http

# Go's profiles (CPU, memory, goroutines) for developers, on localhost in the pod only:
# kubectl port-forward deploy/<release>-darts-o-mat 6060, then e.g.
# go tool pprof http://localhost:6060/debug/pprof/profile
pprof:
  enabled: false
  port: 6060

# More flags and environment variables of the server.
extraArgs: []
extraEnv: []

# More volumes of the pod and mounts of the container.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
