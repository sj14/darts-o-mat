# Values of the darts-o-mat chart. The server keeps its live updates in memory, so there
# is always exactly one replica (no replicaCount, no autoscaling).

image:
  repository: ghcr.io/sj14/darts-o-mat
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The server doesn't talk to the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as "nonroot" (65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# How the server runs, see the flags of darts-o-mat (-db, -dsn). Whether anyone may register
# is set by the admin in the web interface.
config:
  # sqlite: a file in the volume /data (persistence below), good for a home installation.
  # postgres: a PostgreSQL server of your own, then nothing is stored in the pod.
  database: sqlite
  postgres:
    # The data source name, e.g. postgres://darts:secret@postgres:5432/darts?sslmode=disable.
    # Kept in a Secret of this chart; or name a Secret of your own instead.
    dsn: ""
    existingSecret: ""
    existingSecretKey: dsn

# The SQLite database. Without it the data is gone when the pod is replaced.
persistence:
  enabled: true
  # Use a claim you created yourself.
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

service:
  type: ClusterIP
  port: 80

# The game pages are updated live with Server-Sent Events: a proxy must not buffer them
# and not close idle connections too early (the server sends a keepalive every 25 s).
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: darts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: darts-tls
    #   hosts:
    #     - darts.example.com

# Or expose it with the Gateway API.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - darts.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /login
    port: http
readinessProbe:
  httpGet:
    path: /login
    port: http

# More flags and environment variables of the server.
extraArgs: []
extraEnv: []

# More volumes of the pod and mounts of the container.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
